<style>
:root{
  --navy:#0F1B3D;
  --navy-2:#16265A;
  --blue:#1AA7E0;
  --green:#3ED598;
  --grad: linear-gradient(135deg, var(--blue), var(--green));
  --icon-grad: linear-gradient(135deg, #1FC8B6, #123A6B);
  --bg:#F6F8FB;
  --card:#FFFFFF;
  --text:#151A2E;
  --muted:#6B7280;
  --border:#E7EAF2;
  --danger:#E5484D;
  --radius:16px;
  --shadow: 0 8px 24px rgba(15,27,61,.08);
}
*{box-sizing:border-box; margin:0; padding:0}
body{
  font-family:'IBM Plex Sans Arabic', system-ui, sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
a{color:inherit; text-decoration:none}
button{font-family:inherit; cursor:pointer; border:none}
img{max-width:100%; display:block}
.wrap{max-width:1180px; margin:0 auto; padding:0 20px}

/* ---------- شريط علوي ---------- */
.site-nav{
  position:sticky; top:0; z-index:40;
  background:rgba(255,255,255,.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:12px 20px;
}
.nav-inner{max-width:1180px; margin:0 auto; width:100%; display:flex; align-items:center; justify-content:space-between}
.brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px}
.brand img{height:38px; width:auto}
.nav-links{display:flex; align-items:center; gap:22px; font-weight:600; color:var(--muted)}
.nav-links a, .nav-links button.linklike{color:var(--muted); font-weight:600; background:none}
.nav-links a:hover, .nav-links button.linklike:hover{color:var(--navy)}
.nav-actions{display:flex; align-items:center; gap:10px}
.hamburger{display:none; background:none; font-size:22px}

.btn{
  padding:10px 18px; border-radius:10px; font-weight:700; font-size:14px;
  display:inline-flex; align-items:center; gap:8px; transition:.15s;
}
.btn-primary{background:var(--grad); color:#fff}
.btn-primary:hover{filter:brightness(1.06)}
.btn-outline{background:#fff; border:1.5px solid var(--border); color:var(--text)}
.btn-outline:hover{border-color:var(--navy)}
.btn-ghost{background:transparent; color:var(--muted); font-weight:600}
.btn-danger{background:#FDECEC; color:var(--danger)}
.btn-sm{padding:7px 12px; font-size:13px; border-radius:8px}
.btn-block{width:100%; justify-content:center}

/* ---------- تخطيط عام ---------- */
#app{flex:1}
.section{padding:56px 0}
.section-tight{padding:32px 0}
.section-title{font-size:26px; font-weight:800; margin-bottom:6px}
.section-sub{color:var(--muted); margin-bottom:28px}


/* ---------- فلاتر الفئات ---------- */
.cat-filters{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:30px}
.cat-chip{
  padding:8px 16px; border-radius:999px; background:#fff; border:1.5px solid var(--border);
  font-weight:600; font-size:14px; color:var(--muted);
}
.cat-chip.active{background:var(--navy); color:#fff; border-color:var(--navy)}

/* ---------- بطاقات المجالات التعليمية ---------- */
.cat-group{margin-bottom:34px}
.cat-group:last-child{margin-bottom:0}
.cat-group-title{font-weight:800; font-size:16.5px; margin-bottom:14px; display:flex; align-items:center; gap:10px}
.cat-group-title::before{content:''; width:4px; height:18px; background:var(--icon-grad); border-radius:4px}
.cat-cards-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:18px}
.cat-card{
  background:#fff; border:1px solid var(--border); border-radius:var(--radius);
  padding:22px; text-align:center; transition:.18s; display:flex; flex-direction:column; align-items:center; gap:8px;
}
.cat-card:hover{box-shadow:var(--shadow); transform:translateY(-3px); border-color:var(--blue)}
.cat-card.disabled{opacity:.55; cursor:default}
.cat-card.disabled:hover{box-shadow:none; transform:none; border-color:var(--border)}
.cat-card .cat-icon{
  width:56px; height:56px; border-radius:50%; background:var(--icon-grad); color:#fff;
  display:flex; align-items:center; justify-content:center; margin-bottom:4px;
}
.cat-card .cat-icon svg{width:26px; height:26px}
.cat-card .cat-name{font-weight:800; font-size:15.5px}
.cat-card .cat-desc{color:var(--muted); font-size:13px}
.soon-tag{font-size:11px; font-weight:700; color:var(--blue); background:#E7F3FD; padding:2px 10px; border-radius:999px; margin-top:2px}

/* ---------- بطاقات الكورسات ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:20px}
.card{
  background:var(--card); border:1px solid var(--border); border-radius:var(--radius);
  overflow:hidden; transition:.18s; display:flex; flex-direction:column;
}
.card:hover{box-shadow:var(--shadow); transform:translateY(-3px)}
.card-cover{
  aspect-ratio:16/9; background:var(--grad); display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:700; font-size:14px; overflow:hidden;
}
.card-cover img{width:100%; height:100%; object-fit:cover}
.card-body{padding:16px; display:flex; flex-direction:column; gap:8px; flex:1}
.card-cat{font-size:12px; font-weight:700; color:var(--blue)}
.card-title{font-weight:800; font-size:16px}
.card-desc{color:var(--muted); font-size:13.5px; flex:1}
.card-meta{display:flex; justify-content:space-between; align-items:center; font-size:13px; color:var(--muted); margin-top:6px}

.empty-state{
  text-align:center; padding:60px 20px; color:var(--muted);
  background:#fff; border:1.5px dashed var(--border); border-radius:var(--radius);
}
.empty-state .icon{font-size:40px; margin-bottom:10px}

/* ---------- صفحة من نحن ---------- */
.about-grid{display:grid; grid-template-columns:1fr 1fr; gap:40px; align-items:center}
.about-card{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:22px}
@media(max-width:760px){.about-grid{grid-template-columns:1fr}}

/* ---------- صفحة الكورس ---------- */
.course-hero{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:26px; display:flex; gap:24px; margin-bottom:26px}
.course-hero .cover{width:260px; min-width:260px; aspect-ratio:16/9; border-radius:12px; overflow:hidden; background:var(--grad)}
.course-hero .cover img{width:100%; height:100%; object-fit:cover}
@media(max-width:760px){.course-hero{flex-direction:column}.course-hero .cover{width:100%}}
.lecture-list{display:flex; flex-direction:column; gap:10px}
.lecture-row{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:#fff; border:1px solid var(--border); border-radius:12px; padding:14px 16px;
}
.lecture-row:hover{border-color:var(--blue)}
.lecture-row .num{width:30px; height:30px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color:var(--navy)}
.lecture-title{font-weight:700; font-size:14.5px}

/* ---------- صفحة المحاضرة ---------- */
.player-wrap{background:#000; border-radius:var(--radius); overflow:hidden; aspect-ratio:16/9; margin-bottom:20px}
.player-wrap video, .player-wrap iframe{width:100%; height:100%; border:0}

/* ---------- فورمات (تسجيل / لوحة تحكم) ---------- */
.auth-shell{max-width:420px; margin:40px auto; background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:32px}
.auth-shell h2{font-size:22px; font-weight:800; margin-bottom:4px; text-align:center}
.auth-shell p.sub{text-align:center; color:var(--muted); font-size:13.5px; margin-bottom:22px}
.field{margin-bottom:16px}
.field label{display:block; font-size:13.5px; font-weight:700; margin-bottom:6px}
.field input, .field textarea, .field select{
  width:100%; padding:11px 14px; border-radius:10px; border:1.5px solid var(--border);
  font-family:inherit; font-size:14px; background:#fbfcfe;
}
.field input:focus, .field textarea:focus, .field select:focus{outline:none; border-color:var(--blue)}
.field textarea{resize:vertical; min-height:90px}
.form-error{background:#FDECEC; color:var(--danger); padding:10px 14px; border-radius:10px; font-size:13.5px; margin-bottom:14px}
.form-msg-ok{background:#E7F9F1; color:#0B8A5A; padding:10px 14px; border-radius:10px; font-size:13.5px; margin-bottom:14px}
.switch-line{text-align:center; margin-top:16px; font-size:13.5px; color:var(--muted)}
.switch-line button{color:var(--blue); font-weight:700; background:none}

/* ---------- لوحة التحكم ---------- */
.dash-shell{display:grid; grid-template-columns:230px 1fr; gap:24px; align-items:start}
@media(max-width:820px){.dash-shell{grid-template-columns:1fr}}
.dash-side{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:16px; position:sticky; top:80px}
.dash-side .who{padding:8px 10px 16px; border-bottom:1px solid var(--border); margin-bottom:12px}
.dash-side .who .name{font-weight:800; font-size:15px}
.dash-side .who .role{font-size:12px; color:var(--blue); font-weight:700}
.dash-nav a, .dash-nav button{
  display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:10px;
  font-weight:600; font-size:14px; color:var(--muted); background:none; width:100%; text-align:right;
}
.dash-nav a.active, .dash-nav button.active{background:var(--bg); color:var(--navy)}
.dash-main{background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:24px; min-height:400px}
.dash-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; flex-wrap:wrap; gap:10px}
.dash-head h2{font-size:19px; font-weight:800}

.stats-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px}
.stat-box{background:var(--bg); border-radius:12px; padding:16px}
.stat-box .num{font-size:24px; font-weight:800; color:var(--navy)}
.stat-box .lbl{font-size:12.5px; color:var(--muted); font-weight:600}

table.data-table{width:100%; border-collapse:collapse; font-size:13.5px}
table.data-table th{text-align:right; color:var(--muted); font-weight:700; padding:10px; border-bottom:2px solid var(--border)}
table.data-table td{padding:10px; border-bottom:1px solid var(--border)}
table.data-table tr:last-child td{border-bottom:0}
.badge{padding:3px 10px; border-radius:999px; font-size:11.5px; font-weight:700}
.badge-admin{background:#FDECEC; color:var(--danger)}
.badge-instructor{background:#E7F3FD; color:var(--blue)}
.badge-student{background:#EEF1F8; color:var(--muted)}
.row-actions{display:flex; gap:6px}

.profile-header{display:flex; align-items:center; gap:16px; margin-bottom:24px; flex-wrap:wrap}
.avatar-circle{
  width:64px; height:64px; border-radius:50%; background:var(--grad); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:24px;
}
.info-list{display:flex; flex-direction:column; gap:14px}
.info-row{display:flex; justify-content:space-between; padding:12px 0; border-bottom:1px solid var(--border); font-size:14px}
.info-row .k{color:var(--muted); font-weight:600}
.info-row .v{font-weight:700}

/* ---------- Modal ---------- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(15,27,61,.55); z-index:80;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-box{background:#fff; border-radius:var(--radius); padding:24px; max-width:440px; width:100%; max-height:88vh; overflow:auto}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px}
.modal-head h3{font-size:17px; font-weight:800}
.modal-close{font-size:20px; color:var(--muted); background:none}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--navy); color:#fff; padding:12px 22px; border-radius:10px; font-size:13.5px; z-index:100;
  box-shadow:var(--shadow);
}

/* ---------- الفوتر ---------- */
.site-footer{background:var(--navy); color:#C9D2EA; margin-top:40px}
.footer-grid{display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:30px; padding:44px 20px 24px}
@media(max-width:720px){.footer-grid{grid-template-columns:1fr}}
.footer-brand img{height:40px; margin-bottom:12px}
.footer-brand p{font-size:13.5px; color:#93A0C6}
.footer-col h4{color:#fff; font-size:14px; margin-bottom:14px}
.footer-col a{display:block; color:#93A0C6; font-size:13.5px; margin-bottom:10px}
.footer-col a:hover{color:#fff}
.footer-bottom{border-top:1px solid rgba(255,255,255,.1); text-align:center; padding:16px; font-size:12.5px; color:#7C89AE}

.spinner{width:22px; height:22px; border-radius:50%; border:3px solid #fff; border-top-color:transparent; animation:spin 1s linear infinite; margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-line{text-align:center; padding:60px 0; color:var(--muted)}

.hidden{display:none !important}

@media(max-width:820px){
  .nav-links{position:fixed; top:64px; inset-inline:0; background:#fff; flex-direction:column; align-items:stretch;
    padding:16px 20px; border-bottom:1px solid var(--border); display:none; gap:14px}
  .nav-links.open{display:flex}
  .hamburger{display:block}
}
/* =====================================================
   المرحلة 1: واجهة جديدة للصفحة الرئيسية + أنيميشنز
   ===================================================== */
@keyframes heroIn{from{opacity:0; transform:translateY(26px)} to{opacity:1; transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)}}
@keyframes blobMove{0%{transform:translate(0,0) scale(1)} 100%{transform:translate(40px,30px) scale(1.15)}}
@keyframes pulseRing{0%{transform:scale(1); opacity:.55} 100%{transform:scale(1.7); opacity:0}}
@keyframes shine{0%{left:-60%} 60%,100%{left:130%}}
@keyframes cardIn{from{opacity:0; transform:translateY(22px)} to{opacity:1; transform:none}}
section[id]{scroll-margin-top:84px}

/* شريط التقدم + الأزرار العائمة */
.scroll-progress{position:fixed; top:0; inset-inline:0; height:3px; width:0; background:var(--grad); z-index:95; transition:width .1s linear}
.fab-stack{position:fixed; right:16px; bottom:90px; display:flex; flex-direction:column; gap:12px; z-index:60}
.fab{width:50px; height:50px; border-radius:50%; display:grid; place-items:center; color:#fff; position:relative; box-shadow:0 8px 20px rgba(15,27,61,.25); transition:transform .2s}
.fab:hover{transform:scale(1.12)}
.fab svg{width:24px; height:24px}
.fab-fb{background:#1877F2}
.fab-call{background:var(--blue)}
.fab-wa{background:#25D366}
.fab-wa::before{content:''; position:absolute; inset:0; border-radius:50%; background:#25D366; z-index:-1; animation:pulseRing 2s ease-out infinite}
.to-top{position:fixed; left:16px; bottom:24px; width:44px; height:44px; border-radius:50%; background:var(--navy); color:#fff; display:grid; place-items:center; z-index:60; opacity:0; pointer-events:none; transform:translateY(12px); transition:.3s; box-shadow:var(--shadow)}
.to-top.show{opacity:1; pointer-events:auto; transform:none}
.to-top svg{width:20px; height:20px}

/* النافبار */
.site-nav{transition:box-shadow .25s}
.site-nav.scrolled{box-shadow:0 6px 24px rgba(15,27,61,.08)}
.nav-links{gap:20px}
.nav-links a{position:relative; padding:6px 0; font-size:14.5px}
.nav-links a::after{content:''; position:absolute; bottom:0; right:0; width:0; height:2px; background:var(--grad); border-radius:2px; transition:width .25s}
.nav-links a:hover::after{width:100%}
.btn-primary{box-shadow:0 8px 18px rgba(26,167,224,.25)}
.btn-shine{position:relative; overflow:hidden}
.btn-shine::after{content:''; position:absolute; top:0; left:-60%; width:40%; height:100%; background:linear-gradient(120deg,transparent,rgba(255,255,255,.5),transparent); transform:skewX(-20deg); animation:shine 3.2s infinite}

/* الهيرو */
.hero-new{position:relative; overflow:hidden; padding:58px 0 140px; background:linear-gradient(160deg,#EAF6FD 0%,#F1FBF6 55%,#E3F6EE 100%)}
.hero-new .blob{position:absolute; border-radius:50%; animation:blobMove 14s ease-in-out infinite alternate; pointer-events:none}
.hero-new .b1{width:560px; height:560px; top:-200px; left:-140px; background:radial-gradient(circle at 35% 35%, rgba(26,167,224,.30), rgba(26,167,224,0) 70%)}
.hero-new .b2{width:520px; height:520px; bottom:-220px; right:-120px; background:radial-gradient(circle at 60% 60%, rgba(62,213,152,.32), rgba(62,213,152,0) 70%); animation-delay:-5s}
.hero-new .dots{position:absolute; inset:0; background-image:radial-gradient(rgba(15,27,61,.07) 1.5px, transparent 1.5px); background-size:26px 26px; -webkit-mask-image:linear-gradient(to bottom, #000, transparent 85%); mask-image:linear-gradient(to bottom, #000, transparent 85%); pointer-events:none}
.hero-grid{display:grid; grid-template-columns:1.05fr .95fr; gap:40px; align-items:center; position:relative; z-index:2}
.hero-new .anim{opacity:0; animation:heroIn .8s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:var(--d,0s)}
.hero-pill{display:inline-flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--border); padding:6px 16px; border-radius:999px; font-size:13px; font-weight:700; color:var(--navy); box-shadow:0 4px 14px rgba(15,27,61,.06); margin-bottom:18px}
.hero-pill i{width:8px; height:8px; border-radius:50%; background:var(--green); display:block; box-shadow:0 0 0 4px rgba(62,213,152,.25)}
.hero-new h1{font-size:clamp(30px,4.6vw,52px); line-height:1.35; font-weight:800; color:var(--navy); margin-bottom:16px}
.hero-new h1 .grad{background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
.hero-new .lead{color:#5B6478; font-size:17px; max-width:520px; margin-bottom:26px}
.hero-users{display:flex; align-items:center; gap:16px; margin-bottom:28px}
.avatar-stack{display:flex}
.avatar-stack span{width:46px; height:46px; border-radius:50%; border:3px solid #fff; display:grid; place-items:center; color:#fff; font-weight:800; font-size:16px; margin-inline-start:-12px; box-shadow:0 4px 10px rgba(15,27,61,.12)}
.avatar-stack span:first-child{margin-inline-start:0}
.hero-users .cnt{line-height:1.3}
.hero-users .cnt b{font-size:24px; font-weight:800; color:var(--navy); direction:ltr; display:inline-flex}
.hero-users .cnt small{display:block; color:var(--muted); font-weight:600; font-size:13px}
.hero-actions-new{display:flex; gap:12px; flex-wrap:wrap}
.hero-actions-new .btn{padding:13px 26px; font-size:15px; border-radius:12px}
.btn-soft{background:#fff; color:var(--navy); border:1.5px solid var(--border)}
.btn-soft:hover{border-color:var(--blue); color:var(--blue)}
.hero-visual{display:flex; justify-content:center}
.hero-frame{position:relative; width:min(430px,78vw); aspect-ratio:1; animation:floaty 7s ease-in-out infinite}
.hero-ring{position:absolute; inset:-20px; border-radius:50%; border:2px dashed rgba(26,167,224,.45); animation:spin 40s linear infinite}
.hero-circle{position:absolute; inset:0; border-radius:50%; overflow:hidden; border:10px solid #fff; box-shadow:0 30px 70px rgba(15,27,61,.18); background:#fff}
.hero-circle svg, .hero-circle img{width:100%; height:100%; object-fit:cover; display:block}
.chip-float{position:absolute; background:#fff; border-radius:16px; padding:10px 16px; box-shadow:0 14px 32px rgba(15,27,61,.15); display:flex; align-items:center; gap:10px; animation:floaty 5s ease-in-out infinite}
.chip-float .ic{width:36px; height:36px; border-radius:11px; background:var(--icon-grad); color:#fff; display:grid; place-items:center}
.chip-float .ic svg{width:19px; height:19px}
.chip-float b{display:block; font-size:15px; font-weight:800; line-height:1.2; color:var(--navy); direction:ltr; text-align:right}
.chip-float small{color:var(--muted); font-size:12px; font-weight:600}
.chip-float.c1{top:6%; left:-8%; animation-delay:-1s}
.chip-float.c2{bottom:8%; right:-6%; animation-delay:-3s}

/* شريط المميزات العائم */
.feat-bar{margin-top:-86px; position:relative; z-index:5}
.feat-wrap{background:#fff; border-radius:22px; box-shadow:0 24px 60px rgba(15,27,61,.13); display:grid; grid-template-columns:repeat(3,1fr)}
.feat-item{display:flex; align-items:center; gap:16px; padding:26px 28px; border-inline-start:1px solid var(--border); transition:background .25s}
.feat-item:first-child{border-inline-start:0}
.feat-item:hover{background:#F7FBFE}
.feat-item .ic{width:54px; height:54px; border-radius:16px; background:var(--icon-grad); color:#fff; display:grid; place-items:center; flex:none; transition:transform .3s}
.feat-item:hover .ic{transform:rotate(-8deg) scale(1.08)}
.feat-item .ic svg{width:26px; height:26px}
.feat-item h3{font-size:16px; font-weight:800}
.feat-item p{color:var(--muted); font-size:13.5px; line-height:1.6}

/* عناوين الأقسام */
.sec-head{text-align:center; max-width:640px; margin:0 auto 38px}
.sec-head .eyebrow{display:inline-block; font-size:12.5px; font-weight:800; color:var(--blue); background:#E7F3FD; padding:4px 14px; border-radius:999px; margin-bottom:10px}
.sec-head h2{font-size:29px; font-weight:800; margin-bottom:6px}
.sec-head p{color:var(--muted)}

/* ظهور عند السكرول */
.reveal{opacity:0; transform:translateY(28px); transition:opacity .7s ease var(--d,0s), transform .7s cubic-bezier(.2,.7,.2,1) var(--d,0s)}
.reveal.in{opacity:1; transform:none}

/* من نحن */
.about-card .info-row{transition:padding .25s, background .25s}
.about-card .info-row:hover{padding-inline:10px; background:#F7FBFE}

/* شريط الإحصائيات */
.stats-band{background:var(--navy); background-image:radial-gradient(circle at 12% 20%, rgba(26,167,224,.32), transparent 45%), radial-gradient(circle at 88% 85%, rgba(62,213,152,.26), transparent 45%); color:#fff; padding:52px 0; margin:30px 0}
.stats-row{display:grid; grid-template-columns:repeat(4,1fr); gap:20px}
.stat-item{text-align:center}
.stat-item .ic{width:54px; height:54px; border-radius:16px; background:rgba(255,255,255,.08); display:grid; place-items:center; margin:0 auto 12px; color:var(--green)}
.stat-item .ic svg{width:26px; height:26px}
.stat-item .big{direction:ltr; display:inline-flex; font-size:42px; font-weight:800; line-height:1.1}
.stat-item .lbl{color:#C9D2EA; font-weight:600; font-size:14px}

/* المجالات + الكورسات */
.cat-group.reveal{margin-bottom:34px}
.cat-card .cat-icon{transition:transform .3s}
.cat-card:hover .cat-icon{transform:scale(1.1) rotate(-6deg)}
.card-cover img{transition:transform .5s}
.card:hover .card-cover img{transform:scale(1.07)}
.grid .card{animation:cardIn .6s cubic-bezier(.2,.7,.2,1) both}
.grid .card:nth-child(2){animation-delay:.08s} .grid .card:nth-child(3){animation-delay:.16s}
.grid .card:nth-child(4){animation-delay:.24s} .grid .card:nth-child(5){animation-delay:.32s}
.grid .card:nth-child(n+6){animation-delay:.4s}

/* كيف تبدأ */
.steps{display:grid; grid-template-columns:repeat(4,1fr); gap:22px; position:relative}
.steps::before{content:''; position:absolute; top:66px; inset-inline:12%; border-top:2px dashed #CFE3F1; z-index:0}
.steps > *{position:relative; z-index:1}
.step{background:#fff; border:1px solid var(--border); border-radius:20px; padding:34px 20px 24px; text-align:center; transition:.25s; height:100%; position:relative}
.step:hover{transform:translateY(-6px); box-shadow:var(--shadow); border-color:var(--blue)}
.step .n{position:absolute; top:-14px; right:50%; transform:translateX(50%); width:30px; height:30px; border-radius:50%; background:var(--grad); color:#fff; font-weight:800; font-size:14px; display:grid; place-items:center; box-shadow:0 6px 14px rgba(26,167,224,.35)}
.step .ic{width:64px; height:64px; border-radius:20px; background:var(--icon-grad); color:#fff; display:grid; place-items:center; margin:0 auto 14px}
.step .ic svg{width:30px; height:30px}
.step h3{font-size:16px; font-weight:800; margin-bottom:6px}
.step p{color:var(--muted); font-size:13.5px}

/* لماذا تعلّم */
.why-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px}
.why-card{background:#fff; border:1px solid var(--border); border-radius:20px; padding:26px; transition:.25s; height:100%}
.why-card:hover{transform:translateY(-5px); box-shadow:var(--shadow); border-color:var(--green)}
.why-card .ic{width:52px; height:52px; border-radius:15px; background:var(--grad); color:#fff; display:grid; place-items:center; margin-bottom:14px; transition:transform .3s}
.why-card:hover .ic{transform:rotate(-8deg) scale(1.1)}
.why-card .ic svg{width:25px; height:25px}
.why-card h3{font-size:16.5px; font-weight:800; margin-bottom:6px}
.why-card p{color:var(--muted); font-size:14px}

/* آراء الطلاب */
.t-viewport{overflow:hidden; margin:0 -10px}
.t-track{display:flex; transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.t-item{flex:0 0 calc(100% / var(--per,3)); padding:10px}
.t-card{background:#fff; border:1px solid var(--border); border-radius:20px; padding:26px; height:100%; position:relative}
.t-card::before{content:'”'; position:absolute; top:6px; left:20px; font-size:70px; line-height:1; color:#DCEFF9; font-family:Georgia,serif}
.t-stars{color:#F5B301; letter-spacing:2px; margin-bottom:10px; font-size:15px}
.t-card p{color:#3B4258; font-size:14.5px; margin-bottom:18px; min-height:96px}
.t-user{display:flex; align-items:center; gap:12px}
.t-user .av{width:44px; height:44px; border-radius:50%; background:var(--grad); color:#fff; font-weight:800; display:grid; place-items:center}
.t-user b{display:block; font-size:14.5px}
.t-user small{color:var(--muted); font-size:12.5px}
.t-dots{display:flex; justify-content:center; gap:8px; margin-top:20px}
.t-dots button{width:10px; height:10px; border-radius:999px; background:#CBD5E6; transition:.3s; padding:0}
.t-dots button.on{width:28px; background:var(--grad)}

/* الأسئلة الشائعة */
.faq-list{max-width:780px; margin:0 auto; display:flex; flex-direction:column; gap:12px}
.faq-item{background:#fff; border:1px solid var(--border); border-radius:16px; overflow:hidden; transition:border-color .25s, box-shadow .25s}
.faq-item.open{border-color:var(--blue); box-shadow:var(--shadow)}
.faq-q{width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:18px 20px; background:none; font-weight:700; font-size:15px; text-align:right; color:var(--text)}
.faq-q svg{width:20px; height:20px; flex:none; transition:transform .3s; color:var(--blue)}
.faq-item.open .faq-q svg{transform:rotate(180deg)}
.faq-a{display:grid; grid-template-rows:0fr; transition:grid-template-rows .35s ease}
.faq-item.open .faq-a{grid-template-rows:1fr}
.faq-a > div{overflow:hidden}
.faq-a p{padding:0 20px 18px; color:var(--muted); font-size:14.5px}

/* انضم كمحاضر */
.join-banner{background:var(--navy); background-image:radial-gradient(circle at 10% 20%, rgba(26,167,224,.38), transparent 50%), radial-gradient(circle at 90% 90%, rgba(62,213,152,.30), transparent 50%); border-radius:28px; padding:46px; display:grid; grid-template-columns:1.5fr 1fr; gap:24px; align-items:center; color:#fff; position:relative; overflow:hidden}
.join-banner h2{font-size:28px; font-weight:800; margin-bottom:8px}
.join-banner p{color:#C9D2EA; max-width:520px}
.join-banner .act{display:flex; justify-content:flex-end}
.join-banner .btn{padding:14px 28px; font-size:15px; border-radius:12px}

/* تواصل معنا */
.contact-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; max-width:900px; margin:0 auto}
.contact-card{background:#fff; border:1px solid var(--border); border-radius:20px; padding:28px 20px; text-align:center; display:block; transition:.25s}
.contact-card:hover{transform:translateY(-6px); box-shadow:var(--shadow); border-color:var(--blue)}
.contact-card .ic{width:58px; height:58px; border-radius:18px; display:grid; place-items:center; color:#fff; margin:0 auto 12px}
.contact-card .ic svg{width:27px; height:27px}
.contact-card h3{font-size:16px; font-weight:800}
.contact-card span{color:var(--muted); font-size:13.5px; direction:ltr; display:inline-block}

/* الفوتر */
.footer-social{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px}
.footer-social a{display:inline-flex; margin:0; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.08); align-items:center; justify-content:center; color:#fff}
.footer-social a:hover{background:var(--blue)}
.footer-social svg{width:17px; height:17px}
.footer-col a .ltr{direction:ltr; display:inline-block}

@media(max-width:900px){
  .hero-grid{grid-template-columns:1fr; text-align:center}
  .hero-new{padding:40px 0 130px}
  .hero-new .lead{margin-inline:auto}
  .hero-users, .hero-actions-new{justify-content:center}
  .hero-visual{order:-1}
  .hero-frame{width:min(300px,70vw)}
  .feat-wrap{grid-template-columns:1fr}
  .feat-item{border-inline-start:0; border-top:1px solid var(--border)}
  .feat-item:first-child{border-top:0}
  .stats-row, .steps{grid-template-columns:repeat(2,1fr)}
  .steps::before{display:none}
  .join-banner{grid-template-columns:1fr; padding:32px 24px; text-align:center}
  .join-banner p{margin-inline:auto}
  .join-banner .act{justify-content:center}
  .contact-grid{grid-template-columns:1fr}
  .stat-item .big{font-size:34px}
  .sec-head h2{font-size:24px}
}
@media(max-width:560px){
  .chip-float.c1{left:-2%} .chip-float.c2{right:-2%}
  .fab{width:44px; height:44px} .fab-stack{bottom:80px; gap:10px; right:10px}
  .steps{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{animation:none !important; transition:none !important}
  .reveal, .hero-new .anim{opacity:1 !important; transform:none !important}
}
/* =====================================================
   المرحلة 2: دارك مود + بحث وفلترة + مفضلة + تقدّم الطالب
   ===================================================== */
@keyframes shimmer{0%{background-position:200% 0} 100%{background-position:-200% 0}}
.spinner{border-color:var(--border); border-top-color:var(--blue)}
.nav-inner{gap:12px}
.theme-toggle{width:38px; height:38px; border-radius:50%; background:var(--bg); border:1.5px solid var(--border); display:grid; place-items:center; color:var(--text); transition:.2s; flex:none}
.theme-toggle:hover{border-color:var(--blue); color:var(--blue); transform:rotate(15deg)}
.theme-toggle svg{width:19px; height:19px}
.theme-toggle .sun{display:none}
[data-theme="dark"] .theme-toggle .sun{display:block}
[data-theme="dark"] .theme-toggle .moon{display:none}

/* أدوات البحث والفلترة */
.c-toolbar{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-bottom:16px}
.c-search{position:relative; flex:1 1 280px; max-width:420px}
.c-search svg{position:absolute; top:50%; right:14px; transform:translateY(-50%); width:18px; height:18px; color:var(--muted); pointer-events:none}
.c-search input, .c-toolbar select, .tbl-filter{font-family:inherit; font-size:14px; padding:11px 14px; border-radius:12px; border:1.5px solid var(--border); background:var(--card); color:var(--text)}
.c-search input{width:100%; padding-right:42px}
.c-search input:focus, .c-toolbar select:focus, .tbl-filter:focus{outline:none; border-color:var(--blue)}
.c-toolbar .cat-chip{display:inline-flex; align-items:center; gap:6px; border-radius:12px}
.c-toolbar .cat-chip svg{width:16px; height:16px}
.c-count{text-align:center; color:var(--muted); font-size:13px; margin:-10px 0 18px; min-height:20px}
.tbl-filter{width:100%; max-width:320px; margin-bottom:14px; display:block}

/* المفضلة + شارة الإنجاز على كروت الكورسات */
.card-cover{position:relative}
.fav-btn{position:absolute; top:10px; left:10px; width:36px; height:36px; border-radius:50%; background:var(--card); display:grid; place-items:center; color:var(--muted); box-shadow:0 4px 12px rgba(15,27,61,.2); transition:.2s; z-index:2}
.fav-btn:hover{transform:scale(1.12); color:#EF4444}
.fav-btn svg{width:18px; height:18px}
.fav-btn.on{color:#EF4444}
.fav-btn.on svg{fill:#EF4444}
.done-pill{position:absolute; bottom:10px; right:10px; background:rgba(15,27,61,.78); color:#fff; font-size:11.5px; font-weight:700; padding:3px 10px; border-radius:999px}

/* هياكل التحميل */
.skel-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:20px}
.skel-card{border-radius:var(--radius); border:1px solid var(--border); overflow:hidden; background:var(--card)}
.skel-card i{display:block; background:linear-gradient(90deg,var(--bg) 25%,var(--border) 50%,var(--bg) 75%); background-size:200% 100%; animation:shimmer 1.4s linear infinite}
.skel-card .a{aspect-ratio:16/9}
.skel-card .b{height:14px; margin:16px 16px 0; border-radius:6px}
.skel-card .c{height:12px; margin:10px 16px 18px; width:60%; border-radius:6px}

/* شريط التقدم */
.pbar{height:8px; border-radius:99px; background:var(--border); overflow:hidden}
.pbar i{display:block; height:100%; background:var(--grad); border-radius:99px; transition:width .5s}

/* صفحة الكورس */
.course-meta{display:flex; flex-wrap:wrap; gap:8px; margin:12px 0}
.meta-chip{font-size:12.5px; font-weight:700; color:var(--muted); background:var(--bg); border:1px solid var(--border); padding:4px 12px; border-radius:999px}
.course-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px}
.course-actions .btn svg{width:16px; height:16px}
.course-actions .btn.on svg{fill:#EF4444; stroke:#EF4444}
.prog-card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px 20px; margin-bottom:24px}
.prog-top{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; font-size:14.5px}
.lecture-row .num.done{background:var(--green); color:#fff}
.lecture-row .num svg{width:16px; height:16px}

/* صفحة المحاضرة */
.lec-layout{display:grid; grid-template-columns:1fr 330px; gap:22px; align-items:start; margin-top:14px}
.lec-head{display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; margin-bottom:16px}
.lec-head h1{font-size:20px; font-weight:800}
.lec-count{font-size:12.5px; color:var(--blue); font-weight:700}
.lec-nav{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap}
.btn-done{background:#E7F9F1; color:#0B8A5A; border:1.5px solid #BDEBD6}
.lec-side{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; position:sticky; top:80px}
.lec-side-head{padding:16px; border-bottom:1px solid var(--border)}
.lec-side-head b{display:block; font-size:14.5px; margin-bottom:10px}
.lec-side-head small{color:var(--muted); font-size:12.5px; display:block; margin-top:6px}
.lec-side-list{max-height:460px; overflow:auto}
.lec-row{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--border); font-size:13.5px; font-weight:600; transition:background .2s}
.lec-row:last-child{border-bottom:0}
.lec-row:hover{background:var(--bg)}
.lec-row.cur{background:rgba(26,167,224,.1); color:var(--blue)}
.lec-row .n{width:26px; height:26px; border-radius:50%; background:var(--bg); display:grid; place-items:center; font-size:12px; font-weight:800; flex:none}
.lec-row.done .n{background:var(--green); color:#fff}
.lec-row .n svg{width:14px; height:14px}

/* الملف الشخصي: قسم التعلّم */
.learn-sec{margin-top:26px}
.learn-sec h3{font-size:16px; font-weight:800; margin-bottom:12px}
.learn-row{display:flex; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--border)}
.learn-row:last-child{border-bottom:0}
.learn-row .info{flex:1; min-width:0}
.learn-row .t{font-weight:700; font-size:14px; margin-bottom:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.learn-row small{color:var(--muted); font-size:12px}

/* ===== الوضع الداكن ===== */
[data-theme="dark"]{color-scheme:dark; --bg:#0B1226; --card:#121C3A; --text:#E8ECF8; --muted:#97A3C4; --border:#243056; --shadow:0 10px 28px rgba(0,0,0,.45)}
[data-theme="dark"] .site-nav{background:rgba(11,18,38,.88)}
[data-theme="dark"] :is(.btn-outline,.cat-chip,.cat-card,.empty-state,.about-card,.course-hero,.lecture-row,.auth-shell,.dash-side,.dash-main,.modal-box,.hero-pill,.chip-float,.feat-wrap,.step,.why-card,.t-card,.faq-item,.contact-card,.btn-soft){background:var(--card)}
[data-theme="dark"] .field input, [data-theme="dark"] .field textarea, [data-theme="dark"] .field select{background:#0E1630; color:var(--text)}
[data-theme="dark"] :is(.hero-new h1,.hero-users .cnt b,.chip-float b,.hero-pill,.btn-soft,.stat-box .num,.lecture-row .num,.dash-nav a.active,.dash-nav button.active){color:var(--text)}
[data-theme="dark"] .btn-outline:hover{border-color:var(--blue)}
[data-theme="dark"] .cat-chip.active{background:var(--blue); border-color:var(--blue); color:#fff}
[data-theme="dark"] .hero-new{background:linear-gradient(160deg,#0D1A3A 0%,#0B2030 55%,#0B2A27 100%)}
[data-theme="dark"] .hero-new .lead{color:#A9B5D6}
[data-theme="dark"] .hero-new .dots{background-image:radial-gradient(rgba(255,255,255,.07) 1.5px, transparent 1.5px)}
[data-theme="dark"] .hero-circle{border-color:var(--card)}
[data-theme="dark"] .avatar-stack span{border-color:var(--bg)}
[data-theme="dark"] .soon-tag, [data-theme="dark"] .sec-head .eyebrow, [data-theme="dark"] .badge-instructor{background:rgba(26,167,224,.16)}
[data-theme="dark"] .badge-student{background:rgba(255,255,255,.08)}
[data-theme="dark"] .badge-admin, [data-theme="dark"] .btn-danger, [data-theme="dark"] .form-error{background:rgba(229,72,77,.16)}
[data-theme="dark"] .form-msg-ok, [data-theme="dark"] .btn-done{background:rgba(62,213,152,.14); border-color:rgba(62,213,152,.35); color:var(--green)}
[data-theme="dark"] .feat-item:hover, [data-theme="dark"] .about-card .info-row:hover{background:rgba(255,255,255,.04)}
[data-theme="dark"] .t-card::before{color:rgba(255,255,255,.08)}
[data-theme="dark"] .t-card p{color:var(--text); opacity:.85}
[data-theme="dark"] .steps::before{border-color:var(--border)}
[data-theme="dark"] .toast{background:var(--card); border:1px solid var(--border)}
[data-theme="dark"] .t-dots button{background:var(--border)}
[data-theme="dark"] .t-dots button.on{background:var(--grad)}
[data-theme="dark"] .lec-row.cur{color:#6CCBF0}

@media(max-width:900px){
  .lec-layout{grid-template-columns:1fr}
  .lec-side{position:static}
}
</style>
</head>

const state = {
  user: null,       // Firebase Auth user
  userDoc: null,    // مستند /users/{uid}
  role: 'guest',    // guest | student | instructor | admin
  authReady: false,
  coursesCache: null
};

function currentRole(){
  if(!state.user) return 'guest';
  if(isAdminEmail(state.user.email)) return 'admin';
  return (state.userDoc && state.userDoc.role) || 'student';
}

/* ======================= Toast / Modal ======================= */
let toastTimer = null;
function showToast(msg){
  const root = document.getElementById('toastRoot');
  root.innerHTML = `<div class="toast">${escapeHtml(msg)}</div>`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ root.innerHTML=''; }, 3200);
}
function openModal(innerHtml){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="modal-backdrop" id="modalBackdrop"><div class="modal-box">${innerHtml}</div></div>`;
  document.getElementById('modalBackdrop').addEventListener('click', (e)=>{
    if(e.target.id === 'modalBackdrop') closeModal();
  });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ======================= المصادقة ======================= */
async function ensureUserDoc(user){
  const ref = db.collection('users').doc(user.uid);
  const snap = await ref.get();
  if(!snap.exists){
    const data = {
      name: user.displayName || (user.email ? user.email.split('@')[0] : 'مستخدم'),
      email: user.email || '',
      role: 'student',
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    await ref.set(data);
    return { id: user.uid, ...data, createdAt: new Date() };
  }
  return { id: snap.id, ...snap.data() };
}

auth.onAuthStateChanged(async (user)=>{
  state.user = user;
  state.userDoc = null;
  if(user){
    try{ state.userDoc = await ensureUserDoc(user); }
    catch(e){ console.error(e); }
  }
  state.role = currentRole();
  state.authReady = true;
  renderNav();
  route();
});

async function doLogout(){
  await auth.signOut();
  showToast('تم تسجيل الخروج');
  location.hash = '#/';
}

function renderNav(){
  const linksEl = document.getElementById('navLinks');

  linksEl.innerHTML = links;

  if(!state.authReady){
    actionsEl.innerHTML = '';
    return;
  }

  if(!state.user){
    actionsEl.innerHTML = `
      <a href="#/login" class="btn btn-outline btn-sm">تسجيل الدخول</a>
      <a href="#/register" class="btn btn-primary btn-sm">إنشاء حساب</a>`;
  }else{

/* ======================= جلب الكورسات ======================= */
async function fetchCourses(){
  const snap = await db.collection('courses').orderBy('createdAt','desc').get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function fetchCourse(id){
  const snap = await db.collection('courses').doc(id).get();
  if(!snap.exists) return null;
  return { id: snap.id, ...snap.data() };
}
async function fetchLectures(courseId){
  const snap = await db.collection('courses').doc(courseId).collection('lectures').orderBy('order','asc').get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

/* ======================= الراوتر ======================= */
const app = document.getElementById('app');

function route(){
  document.title = DEFAULT_TITLE;
  const hash = location.hash || '#/';
  const parts = hash.replace('#/','').split('/').filter(Boolean);

  if(parts.length === 0) return renderHome();
  if(parts[0] === 'about'){
    pendingScroll = 'aboutSection';
    history.replaceState(null, '', location.pathname + location.search + '#/');
    return renderHome();
  }
  if(parts[0] === 'go' && parts[1]){
    pendingScroll = parts[1];
    history.replaceState(null, '', location.pathname + location.search + '#/');
    return renderHome();
  }
  if(parts[0] === 'login') return renderLogin();
  if(parts[0] === 'register') return renderRegister();
  if(parts[0] === 'profile') return guard(renderProfile);
  if(parts[0] === 'dashboard') return guard(()=> renderDashboard(parts[1]));
  if(parts[0] === 'course' && parts[1]) return renderCoursePage(parts[1]);
  if(parts[0] === 'lecture' && parts[1] && parts[2]) return renderLecturePage(parts[1], parts[2]);
  return renderNotFound();
}
window.addEventListener('hashchange', route);

function guard(renderFn){
  if(!state.authReady){
    app.innerHTML = `<div class="loading-line">جاري التحقق من الحساب...</div>`;
    return;
  }
  if(!state.user){
    location.hash = '#/login';
    return;
  }
  renderFn();
}

/* ======================= أنيميشنز الصفحة الرئيسية ======================= */
let fxObserver = null, sliderTimer = null, sliderResize = null;
const REDUCE_MOTION = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function runCount(el){
  if(el.dataset.done) return; el.dataset.done = '1';
  const target = +el.dataset.count || 0;
  if(REDUCE_MOTION){ el.textContent = target; return; }
  const dur = 1600, t0 = performance.now();
  (function tick(now){
    const p = Math.min((now - t0) / dur, 1);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
    if(p < 1) requestAnimationFrame(tick);
  })(t0);
}

function initHomeFx(){
  if(fxObserver) fxObserver.disconnect();
  clearInterval(sliderTimer);
  if(sliderResize) window.removeEventListener('resize', sliderResize);

  fxObserver = new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(!e.isIntersecting) return;
      if(e.target.dataset.count !== undefined) runCount(e.target);
      else e.target.classList.add('in');
      fxObserver.unobserve(e.target);
    });
  }, { threshold: .15 });
  app.querySelectorAll('.reveal, [data-count]').forEach(el=> fxObserver.observe(el));

  /* الأسئلة الشائعة */
  app.querySelectorAll('.faq-q').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const item = btn.parentElement, wasOpen = item.classList.contains('open');
      app.querySelectorAll('.faq-item').forEach(i=> i.classList.remove('open'));
      if(!wasOpen) item.classList.add('open');
    });
  });

  /* سلايدر آراء الطلاب */
  const track = document.getElementById('tTrack'), dotsEl = document.getElementById('tDots');
  if(track && dotsEl){
    const n = track.children.length;
    let idx = 0, per = 3;
    const calc = ()=> { per = innerWidth > 900 ? 3 : (innerWidth > 620 ? 2 : 1); track.style.setProperty('--per', per); };
    const maxIdx = ()=> Math.max(n - per, 0);
    const go = i=>{
      idx = i > maxIdx() ? 0 : (i < 0 ? maxIdx() : i);
      track.style.transform = `translateX(${idx * 100 / per}%)`;
      dotsEl.querySelectorAll('button').forEach((b,k)=> b.classList.toggle('on', k === idx));
    };
    const build = ()=>{
      calc();
      dotsEl.innerHTML = Array.from({length: maxIdx() + 1}, (_,k)=> `<button type="button" aria-label="${k+1}"></button>`).join('');
      dotsEl.querySelectorAll('button').forEach((b,k)=> b.addEventListener('click', ()=>{ go(k); restart(); }));
      go(Math.min(idx, maxIdx()));
    };
    const restart = ()=>{ clearInterval(sliderTimer); if(!REDUCE_MOTION) sliderTimer = setInterval(()=> go(idx + 1), 4500); };
    sliderResize = build;
    window.addEventListener('resize', sliderResize);
    build(); restart();
    track.addEventListener('mouseenter', ()=> clearInterval(sliderTimer));
    track.addEventListener('mouseleave', restart);
  }
}

/* ---------- أدوات مساعدة ---------- */
function norm(s){
  return (s == null ? '' : String(s)).toLowerCase()
    .replace(/[\u064B-\u065F\u0670\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').trim();
}
function lsGet(k, def){ try{ const v = localStorage.getItem('ta3llam_' + k); return v ? JSON.parse(v) : def; }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem('ta3llam_' + k, JSON.stringify(v)); }catch(e){} }

/* ---------- بيانات الطالب: مفضلة + تقدم (محلي + مزامنة اختيارية مع Firestore) ---------- */
const learner = { uid: null, favs: [], progress: {}, last: {} };
let syncTimer = null, syncBlocked = false;
function uKey(){ return state.user ? state.user.uid : 'guest'; }
function loadLearner(){
  const uid = uKey();
  if(learner.uid === uid) return;
  learner.uid = uid;
  const l = lsGet('learn_' + uid, {});
  learner.favs = l.favs || []; learner.progress = l.progress || {}; learner.last = l.last || {};
  const d = state.userDoc || {};
  if(state.user){
    (d.favorites || []).forEach(id => { if(!learner.favs.includes(id)) learner.favs.push(id); });
    const dp = d.progress || {};
    Object.keys(dp).forEach(c => { learner.progress[c] = [...new Set([...(learner.progress[c] || []), ...(dp[c] || [])])]; });
  }
}
function saveLearner(){
  lsSet('learn_' + uKey(), { favs: learner.favs, progress: learner.progress, last: learner.last });
  if(!state.user || syncBlocked) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(async ()=>{
    try{ await db.collection('users').doc(state.user.uid).update({ favorites: learner.favs, progress: learner.progress }); }
    catch(e){ syncBlocked = true; console.warn('تعذرت مزامنة التقدم مع الحساب، سيتم الحفظ على الجهاز فقط'); }
  }, 1200);
}
function isFav(id){ loadLearner(); return learner.favs.includes(id); }
function toggleFav(id){
  loadLearner();
  const i = learner.favs.indexOf(id);
  if(i >= 0) learner.favs.splice(i, 1); else learner.favs.push(id);
  saveLearner();
  return i < 0;
}
function doneList(cid){ loadLearner(); return learner.progress[cid] || []; }
function setDone(cid, lid, val){
  loadLearner();
  const set = new Set(learner.progress[cid] || []);
  if(val) set.add(lid); else set.delete(lid);
  learner.progress[cid] = [...set];
  saveLearner();
}
function shareCourse(title, id){
  const url = location.href.split('#')[0] + '#/course/' + id;
  if(navigator.share){ navigator.share({ title, url }).catch(()=>{}); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=> showToast('تم نسخ رابط الكورس'), ()=> showToast(url));
  }else showToast(url);
}

async function renderCoursesGrid(){
  const gridEl = document.getElementById('coursesGrid');
  if(!gridEl) return;

    if(!state.coursesCache) state.coursesCache = await fetchCourses();

    if(courseFilter.sort === 'old') list.sort((a,b)=> courseTs(a) - courseTs(b));
    else if(courseFilter.sort === 'az') list.sort((a,b)=> (a.title||'').localeCompare(b.title||'', 'ar'));

    const videoHtml = renderVideoEmbed(lecture.videoUrl);

    app.innerHTML = `
      <div class="wrap section-tight">
        <a href="#/course/${courseId}" style="color:var(--muted); font-size:13.5px">→ العودة لصفحة الكورس</a>
        <div class="lec-layout">
          <div>
            <div class="player-wrap">${videoHtml}</div>
            <div class="lec-head">
              <div><div class="lec-count">المحاضرة ${idx+1} من ${lectures.length}</div><h1>${escapeHtml(lecture.title)}</h1></div>
              <button class="btn btn-outline btn-sm" id="markDone" type="button"></button>
            </div>
            <div class="lec-nav">
              ${prev ? `<a class="btn btn-outline" href="#/lecture/${courseId}/${prev.id}">المحاضرة السابقة</a>` : '<span></span>'}
              ${next ? `<a class="btn btn-primary" id="nextLec" href="#/lecture/${courseId}/${next.id}">المحاضرة التالية</a>` : ''}
            </div>
          </div>
          <aside class="lec-side">
            <div class="lec-side-head">
              <b>${escapeHtml(course.title)}</b>
              <div class="pbar"><i id="sideBar" style="width:0%"></i></div>
              <small id="sideTxt"></small>
            </div>
            <div class="lec-side-list">
              ${lectures.map((l,i)=>`
                <a class="lec-row ${l.id===lectureId?'cur':''}" data-lid="${l.id}" href="#/lecture/${courseId}/${l.id}">
                  <span class="n">${i+1}</span><span>${escapeHtml(l.title)}</span>
                </a>`).join('')}
            </div>
          </aside>
        </div>
      </div>`;

    const markBtn = document.getElementById('markDone');
    const refresh = ()=>{
      const d = new Set(doneList(courseId));
      const n = lectures.filter(l => d.has(l.id)).length;
      document.getElementById('sideBar').style.width = (lectures.length ? Math.round(n / lectures.length * 100) : 0) + '%';
      document.getElementById('sideTxt').textContent = `أنجزت ${n} من ${lectures.length} محاضرة`;
      app.querySelectorAll('.lec-row').forEach((row, i)=>{
        const ok = d.has(row.dataset.lid);
        row.classList.toggle('done', ok);
        row.querySelector('.n').innerHTML = ok ? ICONS2.check : (i + 1);
      });
      const cur = isDone();
      markBtn.className = 'btn btn-sm ' + (cur ? 'btn-done' : 'btn-outline');
      markBtn.innerHTML = cur ? `${ICONS2.check} تم إكمال المحاضرة` : 'تحديد كمكتملة';
      markBtn.querySelector('svg') && (markBtn.querySelector('svg').style.cssText = 'width:15px;height:15px');
    };
    markBtn.addEventListener('click', ()=>{
      const now = !isDone();
      setDone(courseId, lectureId, now);
      refresh();
      showToast(now ? 'أحسنت! تم تسجيل المحاضرة كمكتملة' : 'تم إلغاء الإكمال');
    });
    const nextEl = document.getElementById('nextLec');
    if(nextEl) nextEl.addEventListener('click', ()=> setDone(courseId, lectureId, true));
    refresh();
  }catch(e){
    console.error(e);
    app.innerHTML = `<div class="wrap section"><div class="empty-state">تعذر تحميل المحاضرة</div></div>`;
  }
}

async function renderLearningSection(){

  if(!wrap) return;

  try{ courses = state.coursesCache || (state.coursesCache = await fetchCourses()); }catch(e){ console.error(e); }
  const byId = {}; courses.forEach(c => byId[c.id] = c);
  const started = Object.keys(learner.progress).filter(id => byId[id] && (learner.progress[id] || []).length > 0);
  const totalDone = started.reduce((s, id) => s + learner.progress[id].length, 0);
  const favCourses = learner.favs.map(id => byId[id]).filter(Boolean);
  if(!document.getElementById('learningWrap')) return;

  wrap.innerHTML = `

          <div class="info"><div class="t">${escapeHtml(byId[id].title)}</div><div class="pbar"><i style="width:0%"></i></div><small>أنجزت ${learner.progress[id].length} محاضرة</small></div>

        </div>`).join('') : `<div class="empty-state" style="padding:26px 16px">لسه ما بدأتش أي كورس، اختار كورس وابدأ أول محاضرة</div>`}
    </div>
    <div class="learn-sec">
      <h3>مفضلتي</h3>

    e.preventDefault(); e.stopPropagation();
    toggleFav(b.dataset.fav); renderLearningSection();
  }));
  started.forEach(async id => {

    }catch(e){}
  });
}

function addTableFilter(id){
  const el = document.getElementById(id);
  if(!el || !el.querySelector('table') || el.querySelector('.tbl-filter')) return;
  const inp = document.createElement('input');
  inp.type = 'search'; inp.className = 'tbl-filter'; inp.placeholder = 'بحث في الجدول...';
  el.insertBefore(inp, el.firstChild);
  inp.addEventListener('input', ()=>{
    const q = norm(inp.value);
    el.querySelectorAll('tbody tr').forEach(tr => { tr.style.display = (!q || norm(tr.textContent).includes(q)) ? '' : 'none'; });
  });
}
[['renderAdminCoursesTable','adminCoursesTable'], ['renderUsersTable','usersTable'], ['renderMyCoursesTable','myCoursesTable']].forEach(([fn, id])=>{
  const orig = window[fn];
  window[fn] = function(){ const r = orig.apply(this, arguments); addTableFilter(id); return r; };
});
function newUsersCount(users, days){
  const lim = Date.now() - days * 864e5;
  return users.filter(u => { try{ const d = u.createdAt && u.createdAt.toDate ? u.createdAt.toDate() : null; return d && d.getTime() >= lim; }catch(e){ return false; } }).length;
}

function renderVideoEmbed(url){
  if(!url) return `<div style="color:#fff; display:flex; align-items:center; justify-content:center; height:100%">لا يوجد فيديو مرفق</div>`;
  const yt = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/);
  if(yt) return `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen></iframe>`;
  return `<video src="${escapeHtml(url)}" controls></video>`;
}

function openCourseModal(course){
  const isEdit = !!course;
  openModal(`
    <div class="modal-head"><h3>${isEdit?'تعديل الكورس':'إضافة كورس جديد'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>

      <div class="field"><label>القسم</label>
        <select name="category" required>
          ${CATEGORIES.map(c=>`<option value="${c.id}" ${course?.category===c.id?'selected':''}>${c.label}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>رابط صورة الغلاف (اختياري)</label><input type="url" name="coverImage" value="${escapeHtml(course?.coverImage||'')}"></div>
      <button class="btn btn-primary btn-block" type="submit">${isEdit?'حفظ التعديلات':'إضافة الكورس'}</button>
    </form>`);

  document.getElementById('courseForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const f = e.target;
    const payload = {
      title: f.title.value.trim(),
      description: f.description.value.trim(),
      category: f.category.value,
      coverImage: f.coverImage.value.trim(),
      instructorId: state.user.uid,
      instructorName: state.userDoc?.name || state.user.email
    };
    try{
      if(isEdit){
        await db.collection('courses').doc(course.id).update(payload);
      }else{
        payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await db.collection('courses').add(payload);
      }
      state.coursesCache = null;
      closeModal();
      showToast(isEdit ? 'تم حفظ التعديلات' : 'تم إضافة الكورس');
      renderInstructorDashboard('courses');
    }catch(err){
      console.error(err);
      showToast('حصل خطأ أثناء الحفظ');
    }
  });
}

    return;
  }
  el.innerHTML = lectures.map((l,i)=>`
    <div class="lecture-row">
      <div style="display:flex; align-items:center; gap:10px"><div class="num">${i+1}</div><div class="lecture-title">${escapeHtml(l.title)}</div></div>
      <div class="row-actions">
        <button class="btn btn-outline btn-sm edit-lec" data-id="${l.id}">تعديل</button>
        <button class="btn btn-danger btn-sm del-lec" data-id="${l.id}">حذف</button>
      </div>
    </div>`).join('');

  el.querySelectorAll('.edit-lec').forEach(b => b.addEventListener('click', ()=>{
    const l = lectures.find(x=>x.id===b.dataset.id); openLectureForm(courseId, l, lectures.length);
  }));
  el.querySelectorAll('.del-lec').forEach(b => b.addEventListener('click', async ()=>{
    if(!confirm('تأكيد حذف المحاضرة؟')) return;
    await db.collection('courses').doc(courseId).collection('lectures').doc(b.dataset.id).delete();
    showToast('تم حذف المحاضرة');
    const updated = await fetchLectures(courseId);
    renderLecturesModalList(courseId, updated);
  }));
}

function openLectureForm(courseId, lecture, countIfNew){
  const isEdit = !!lecture;
  openModal(`
    <div class="modal-head"><h3>${isEdit?'تعديل المحاضرة':'إضافة محاضرة'}</h3><button class="modal-close" onclick="closeModal()">✕</button></div>
    <form id="lectureForm">
      <div class="field"><label>عنوان المحاضرة</label><input type="text" name="title" value="${escapeHtml(lecture?.title||'')}" required></div>
      <div class="field"><label>رابط الفيديو (YouTube أو رابط مباشر)</label><input type="url" name="videoUrl" value="${escapeHtml(lecture?.videoUrl||'')}" required></div>
      <button class="btn btn-primary btn-block" type="submit">${isEdit?'حفظ':'إضافة'}</button>
    </form>`);

  document.getElementById('lectureForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const f = e.target;
    const payload = { title: f.title.value.trim(), videoUrl: f.videoUrl.value.trim() };
    try{
      const col = db.collection('courses').doc(courseId).collection('lectures');
      if(isEdit){
        await col.doc(lecture.id).update(payload);
      }else{
        payload.order = countIfNew;
        payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
        await col.add(payload);
      }
      showToast(isEdit ? 'تم حفظ المحاضرة' : 'تم إضافة المحاضرة');
      const updated = await fetchLectures(courseId);
      renderLecturesModalList(courseId, updated);
    }catch(err){
      console.error(err);
      showToast('حصل خطأ أثناء الحفظ');
    }
  });
}

/* -------- لوحة الأدمن -------- */
async function renderAdminDashboard(tab){
  const who = { name: state.userDoc?.name || state.user.email, roleLabel: 'أدمن' };
  const nav = `
    <button data-tab="overview" class="${tab==='overview'?'active':''}">نظرة عامة</button>
    <button data-tab="courses" class="${tab==='courses'?'active':''}">الكورسات</button>
    <button data-tab="users" class="${tab==='users'?'active':''}">المستخدمين</button>`;

  app.innerHTML = dashShellHtml(nav, `<div class="loading-line"><div class="spinner"></div></div>`, who);
  bindDashNav('admin');

  const mainEl = document.querySelector('.dash-main');

  if(tab === 'courses'){
    const courses = await fetchCourses();
    mainEl.innerHTML = `
      <div class="dash-head"><h2>كل الكورسات</h2><button class="btn btn-primary btn-sm" id="addCourseBtnAdmin">+ إضافة كورس</button></div>
      <div id="adminCoursesTable"></div>`;
    renderAdminCoursesTable(courses);
    document.getElementById('addCourseBtnAdmin').addEventListener('click', ()=> openCourseModal(null));
  }else if(tab === 'users'){
    const usersSnap = await db.collection('users').get();
    const users = usersSnap.docs.map(d=>({id:d.id, ...d.data()}));
    mainEl.innerHTML = `<div class="dash-head"><h2>المستخدمين</h2></div><div id="usersTable"></div>`;
    renderUsersTable(users);
  }else{
    const [courses, usersSnap] = await Promise.all([fetchCourses(), db.collection('users').get()]);
    const users = usersSnap.docs.map(d=>d.data());
    const instructorsCount = users.filter(u=>u.role==='instructor').length;
    mainEl.innerHTML = `
      <div class="dash-head"><h2>نظرة عامة</h2></div>
      <div class="stats-grid">
        <div class="stat-box"><div class="num">${courses.length}</div><div class="lbl">إجمالي الكورسات</div></div>
        <div class="stat-box"><div class="num">${users.length}</div><div class="lbl">إجمالي المستخدمين</div></div>
        <div class="stat-box"><div class="num">${instructorsCount}</div><div class="lbl">المحاضرين</div></div>
        <div class="stat-box"><div class="num">${users.filter(u=>!isAdminEmail(u.email) && u.role!=='instructor').length}</div><div class="lbl">الطلاب</div></div>
        <div class="stat-box"><div class="num">${newUsersCount(users,30)}</div><div class="lbl">مسجلين جدد (30 يوم)</div></div>
      </div>`;
  }
}

function renderAdminCoursesTable(courses){
  const el = document.getElementById('adminCoursesTable');
  if(courses.length === 0){ el.innerHTML = `<div class="empty-state">لا توجد كورسات بعد</div>`; return; }
  el.innerHTML = `
    <table class="data-table">
      <thead><tr><th>الكورس</th><th>القسم</th><th>المحاضر</th><th></th></tr></thead>
      <tbody>
        ${courses.map(c=>`
          <tr>
            <td>${escapeHtml(c.title)}</td>
            <td>${catLabel(c.category)}</td>
            <td>${escapeHtml(c.instructorName||'—')}</td>
            <td class="row-actions">
              <button class="btn btn-outline btn-sm manage-lectures" data-id="${c.id}" data-title="${escapeHtml(c.title)}">المحاضرات</button>
              <button class="btn btn-outline btn-sm edit-course" data-id="${c.id}">تعديل</button>
              <button class="btn btn-danger btn-sm del-course" data-id="${c.id}">حذف</button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>`;

  el.querySelectorAll('.edit-course').forEach(b=>b.addEventListener('click', ()=>{
    const c = courses.find(x=>x.id===b.dataset.id); openCourseModal(c);
  }));
  el.querySelectorAll('.del-course').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('تأكيد حذف الكورس؟')) return;
    await db.collection('courses').doc(b.dataset.id).delete();
    state.coursesCache = null;
    showToast('تم حذف الكورس');
    renderAdminDashboard('courses');
  }));
  el.querySelectorAll('.manage-lectures').forEach(b=>b.addEventListener('click', ()=> openLecturesManager(b.dataset.id, b.dataset.title)));
}

function renderUsersTable(users){
  const el = document.getElementById('usersTable');
  el.innerHTML = `
    <table class="data-table">
      <thead><tr><th>الاسم</th><th>البريد الإلكتروني</th><th>الدور</th><th></th></tr></thead>
      <tbody>
        ${users.map(u=>{
          const role = isAdminEmail(u.email) ? 'admin' : (u.role||'student');
          const roleLabel = role==='admin'?'أدمن':role==='instructor'?'محاضر':'طالب';
          return `
          <tr>
            <td>${escapeHtml(u.name||'—')}</td>
            <td>${escapeHtml(u.email||'—')}</td>
            <td><span class="badge badge-${role}">${roleLabel}</span></td>
            <td class="row-actions">
              ${role==='admin' ? '' : role==='instructor'
                ? `<button class="btn btn-outline btn-sm demote-btn" data-id="${u.id}">إلغاء صفة محاضر</button>`
                : `<button class="btn btn-outline btn-sm promote-btn" data-id="${u.id}">ترقية لمحاضر</button>`}
            </td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;

  el.querySelectorAll('.promote-btn').forEach(b=>b.addEventListener('click', async ()=>{
    await db.collection('users').doc(b.dataset.id).update({ role:'instructor' });
    showToast('تم ترقية المستخدم لمحاضر');
    renderAdminDashboard('users');
  }));
  el.querySelectorAll('.demote-btn').forEach(b=>b.addEventListener('click', async ()=>{
    await db.collection('users').doc(b.dataset.id).update({ role:'student' });
    showToast('تم إلغاء صفة المحاضر');
    renderAdminDashboard('users');
  }));
}

function bindDashNav(role){
  document.querySelectorAll('.dash-nav button').forEach(b=>{
    b.addEventListener('click', ()=>{
      const tab = b.dataset.tab;
      if(role==='admin') renderAdminDashboard(tab); else renderInstructorDashboard(tab);
    });
  });
}

/* ======================= 404 ======================= */
function renderNotFound(){
  app.innerHTML = `<div class="wrap section"><div class="empty-state">الصفحة غير موجودة</div></div>`;
}

/* ======================= بداية التشغيل ======================= */
renderNav();
route();

</script>
